<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />

    <!-- GitHub Pages SPA redirect 還原：把 404.html 存的 LIFF callback URL 用 replaceState 還原 -->
    <script>
      (function () {
        var redirect = sessionStorage.getItem('__spa_redirect__');
        if (redirect) {
          sessionStorage.removeItem('__spa_redirect__');
          var u = new URL(redirect);
          // 僅還原 pathname + search + hash，不做頁面跳轉
          window.history.replaceState(null, '', u.pathname + u.search + u.hash);
        }
      })();
    </script>
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width"
    />

    <link rel="icon" type="image/ico" href="favicon.ico" />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
